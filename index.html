<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowForge · 导流图工作台</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f7f9fc; --border:#e3e8f0;
  --text:#1e293b; --dim:#64748b; --accent:#2563eb; --accent2:#eef4ff;
  --hover:#f1f5f9; --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.08);
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#080d13; --panel:#101720; --panel2:#0c1219; --border:#1d2a37;
  --text:#e5edf6; --dim:#7d8ea1; --accent:#38bdf8; --accent2:#0e2231;
  --hover:#16202b; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;border:none;background:none}
.app{display:grid;grid-template-rows:52px 1fr 26px;height:100vh}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:.2px;margin-right:10px}
.brand .mark{
  width:22px;height:22px;border-radius:6px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;
  box-shadow:0 0 0 3px var(--accent2);
}
.brand small{color:var(--dim);font-weight:400;font-size:11.5px;letter-spacing:0}
.tb-group{display:flex;align-items:center;gap:4px}
.tb-spacer{flex:1}
.btn{
  height:32px;padding:0 11px;border-radius:8px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;
  transition:background .13s,border-color .13s,color .13s;white-space:nowrap;
}
.btn:hover{background:var(--hover);border-color:var(--border)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.icon{width:32px;padding:0;justify-content:center;font-size:15px;color:var(--dim)}
.btn.icon:hover{color:var(--text)}
.btn[disabled]{opacity:.34;cursor:default}
.btn[disabled]:hover{background:transparent;border-color:transparent}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 主区 ---------- */
.main{display:grid;grid-template-columns:52px 1fr 290px;min-height:0}

/* 左侧工具条 */
.toolbar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;
}
.tool{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--dim);position:relative;transition:background .13s,color .13s;
}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.active{background:var(--accent2);color:var(--accent)}
html[data-theme="dark"] .tool.active{background:var(--accent2);color:var(--accent)}
.tool::after{
  content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%) scale(.96);
  background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:7px;
  padding:5px 9px;font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;
  box-shadow:var(--shadow);transition:opacity .12s,transform .12s;z-index:60;
}
.tool:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
.tool-sep{width:24px;height:1px;background:var(--border);margin:4px 0}

/* 画布 */
.canvas-wrap{position:relative;overflow:hidden;background:var(--bg)}
/* 节点锚点：默认隐藏，悬停或选中时才浮现 */
.node .anchor{opacity:0;pointer-events:none;transition:opacity .12s ease}
.node:hover .anchor,.node.sel .anchor{opacity:1;pointer-events:auto}
.node{cursor:move}
.note{cursor:move}
.edge{cursor:pointer}
#stage{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#stage.mode-node{cursor:crosshair}
#stage.mode-connect{cursor:crosshair}
#stage.panning{cursor:grabbing}

.zoombar{
  position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:2px;
  background:var(--panel);border:1px solid var(--border);border-radius:9px;
  padding:3px;box-shadow:var(--shadow);
}
.zoombar button{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dim);font-size:14px}
.zoombar button:hover{background:var(--hover);color:var(--text)}
.zoombar .divider{height:1px;background:var(--border);margin:2px 4px}

.hint{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:12px;color:var(--dim);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;
}
.hint.show{opacity:1}

/* 属性面板 */
.inspector{
  background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;padding:14px;font-size:12.5px;
}
.insp-empty{color:var(--dim);line-height:1.85;font-size:12.5px}
.insp-empty b{color:var(--text);font-weight:600}
.insp-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.insp-sec{border-top:1px solid var(--border);margin-top:14px;padding-top:13px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.field label{width:56px;flex:0 0 56px;color:var(--dim);font-size:12px}
.field .grow{flex:1;min-width:0}
input[type="text"],input[type="number"],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;outline:none;
  transition:border-color .13s,box-shadow .13s;
}
input[type="text"]:focus,input[type="number"]:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2);
}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input[type="color"]{
  width:100%;height:28px;padding:2px;border:1px solid var(--border);border-radius:7px;
  background:var(--panel2);cursor:pointer;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-block{
  width:100%;height:31px;border-radius:7px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:12.5px;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-block:hover{background:var(--hover);border-color:var(--accent)}
.btn-block.danger{color:#e11d48;border-color:#fecdd3}
.btn-block.danger:hover{background:#fff1f2;border-color:#e11d48}
html[data-theme="dark"] .btn-block.danger{color:#fb7185;border-color:#4c1d24}
html[data-theme="dark"] .btn-block.danger:hover{background:#1f1114}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pill-grid .pill{min-width:0}
.pill{
  flex:1;min-width:38px;height:28px;border-radius:7px;border:1px solid var(--border);
  background:var(--panel2);color:var(--dim);font-size:11.5px;display:grid;place-items:center;
}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.align-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

/* 状态栏 */
.statusbar{
  display:flex;align-items:center;gap:14px;padding:0 14px;font-size:11.5px;color:var(--dim);
  background:var(--panel);border-top:1px solid var(--border);
}
.statusbar b{color:var(--text);font-weight:600}
.st-spacer{flex:1}

/* 菜单 */
#menuLayer{position:fixed;inset:0;z-index:80;display:none}
#menuLayer.on{display:block}
.menu{
  position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);padding:5px;min-width:186px;
}
.menu-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;
  font-size:12.5px;color:var(--text);cursor:pointer;width:100%;text-align:left;
}
.menu-item:hover{background:var(--hover)}
.menu-item .k{margin-left:auto;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.menu-sep{height:1px;background:var(--border);margin:4px 6px}
.menu-head{font-size:10.5px;color:var(--dim);padding:6px 10px 3px;letter-spacing:.07em;text-transform:uppercase}

/* 模态 */
#modalLayer{position:fixed;inset:0;background:rgba(10,15,22,.42);z-index:90;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modalLayer.on{display:flex}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  width:min(680px,92vw);max-height:84vh;overflow:auto;padding:22px 24px;
}
.modal h2{margin:0 0 4px;font-size:16px;font-weight:650}
.modal p.sub{margin:0 0 16px;color:var(--dim);font-size:12.5px}
.kbd-table{width:100%;border-collapse:collapse;font-size:12.5px}
.kbd-table td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
.kbd-table td:first-child{width:190px}
.kbd-table tr:last-child td{border-bottom:none}
kbd{
  display:inline-block;background:var(--panel2);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);margin-right:3px;
}
.modal-close{position:sticky;top:0;float:right;margin:-6px -8px 0 0}

/* 文字编辑浮层 */
#editorOverlay{
  position:fixed;z-index:75;display:none;
  background:var(--panel);border:2px solid var(--accent);border-radius:8px;
  box-shadow:0 0 0 4px var(--accent2),var(--shadow);padding:6px;
}
#editorOverlay.on{display:block}
#editorOverlay textarea{
  width:100%;height:100%;border:none;background:transparent;resize:none;outline:none;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  text-align:center;line-height:1.4;
}
.toast{
  position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(8px);
  background:#1e293b;color:#fff;padding:9px 16px;border-radius:9px;font-size:12.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.28);opacity:0;transition:opacity .18s,transform .18s;
  z-index:95;pointer-events:none;max-width:80vw;
}
html[data-theme="dark"] .toast{background:#e5edf6;color:#0b1016}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">F</span>
      FlowForge <small>导流图工作台</small>
    </div>
    <div class="tb-group">
      <button class="btn" id="btnTemplates">模板
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="btn" id="btnLayout">自动布局
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="btn icon" id="btnUndo" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg>
      </button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <button class="btn" id="btnImport">导入
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="btn primary" id="btnExport">导出
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="btn icon" id="btnTheme" title="切换主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 010 16z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="btn icon" id="btnHelp" title="快捷键 ( ? )">?</button>
    </div>
  </header>

  <div class="main">
    <nav class="toolbar" id="toolbar">
      <button class="tool active" data-tool="select" data-tip="选择 / 框选 (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l13 8.5-6.2 1.3L9 19z"/></svg>
      </button>
      <button class="tool" data-tool="node" data-tip="添加节点 (N)">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="12" height="9" rx="2"/><path d="M19 8v8M15 12h8"/></svg>
      </button>
      <button class="tool" data-tool="connect" data-tip="连线 (C)">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="2.5"/><circle cx="18.5" cy="18" r="2.5"/><path d="M7.5 8Q12 12 16.5 16"/></svg>
      </button>
      <button class="tool" data-tool="note" data-tip="批注便签 (M)">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v10l-5 5H4z"/><path d="M20 15h-5v5"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="fit" data-tip="适配视图 (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
      </button>
    </nav>

    <div class="canvas-wrap" id="canvasWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <pattern id="gridPat" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="1.2" cy="1.2" r="1.1" id="gridDot"></circle>
        </pattern>
        <rect id="gridRect" x="0" y="0" width="100%" height="100%"></rect>
        <g id="vp"></g>
      </svg>
      <div class="zoombar">
        <button id="zIn" title="放大">+</button>
        <button id="zOut" title="缩小">−</button>
        <div class="divider"></div>
        <button id="zFit" title="适配视图">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
        </button>
        <div class="divider"></div>
        <button id="zReset" title="重置 100%">1:1</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <footer class="statusbar">
    <span id="stCount">节点 0 · 连线 0</span>
    <span id="stSel"></span>
    <span class="st-spacer"></span>
    <span id="stPos">x 0, y 0</span>
    <span id="stZoom">100%</span>
  </footer>
</div>

<div id="menuLayer"><div class="menu" id="menu"></div></div>
<div id="modalLayer"><div class="modal" id="modal"></div></div>
<div id="editorOverlay"><textarea id="editorArea" spellcheck="false"></textarea></div>
<input type="file" id="fileInput" hidden multiple>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   0. 基础常量与主题
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const FONT = 'system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';

const THEMES = {
  light: {
    canvas:"#f5f7fa", grid:"#cfd8e6",
    nodeFill:"#ffffff", nodeStroke:"#cbd5e1", nodeText:"#1f2937",
    edge:"#94a3b8", edgeText:"#64748b", edgeBg:"#f5f7fa",
    noteFill:"#fef9e2", noteStroke:"#f0d75e", noteText:"#713f12", noteBar:"#f5d24b",
    sel:"#2563eb"
  },
  dark: {
    canvas:"#080d13", grid:"#1a2532",
    nodeFill:"#151e29", nodeStroke:"#2d3c4e", nodeText:"#e6eef8",
    edge:"#5c7086", edgeText:"#93a6bb", edgeBg:"#080d13",
    noteFill:"#33290f", noteStroke:"#8a6d1a", noteText:"#fde68a", noteBar:"#8a6d1a",
    sel:"#38bdf8"
  }
};

const SHAPES = [
  {id:"rect",    name:"矩形"},
  {id:"round",   name:"圆角"},
  {id:"diamond", name:"菱形"},
  {id:"ellipse", name:"椭圆"},
  {id:"cylinder",name:"数据"}
];

/* ============================================================
   1. 状态
   ============================================================ */
let uidSeq = Date.now() % 100000;
const uid = p => p + (++uidSeq).toString(36) + Math.random().toString(36).slice(2,5);

const state = {
  nodes:[], edges:[], notes:[],
  theme:"light",
  view:{tx:0, ty:0, k:1}
};

let sel = new Set();          // "node:id" | "edge:id" | "note:id"
let tool = "select";          // select | node | connect | note
let connectFrom = null;       // 连线模式下已选定的起点节点 id
let clipboard = null;
let spaceDown = false;
let drag = null;              // 当前拖拽会话
let lastMouseWorld = {x:0,y:0};

/* ============================================================
   2. DOM
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const svg      = $("#stage");
const vp       = $("#vp");
const defs     = $("#defs");
const gridRect = $("#gridRect");
const gridPat  = $("#gridPat");
const gridDot  = $("#gridDot");
const wrap     = $("#canvasWrap");
const inspector= $("#inspector");
const hint     = $("#hint");
const toastEl  = $("#toast");
const menuLayer= $("#menuLayer");
const menuEl   = $("#menu");
const modalLayer=$("#modalLayer");
const modalEl  = $("#modal");
const editorOverlay = $("#editorOverlay");
const editorArea    = $("#editorArea");
const fileInput     = $("#fileInput");

/* ============================================================
   3. 几何与工具函数
   ============================================================ */
const byId = id => state.nodes.find(n => n.id === id) || null;

function markerId(color){
  return "ar" + String(color).replace(/[^a-zA-Z0-9]/g,"");
}

function anchorPoint(n, side){
  switch(side){
    case "l": return {x:n.x,          y:n.y + n.h/2};
    case "r": return {x:n.x + n.w,    y:n.y + n.h/2};
    case "t": return {x:n.x + n.w/2,  y:n.y};
    default:  return {x:n.x + n.w/2,  y:n.y + n.h};
  }
}

function autoSides(a, b){
  const ax = a.x + a.w/2, ay = a.y + a.h/2;
  const bx = b.x + b.w/2, by = b.y + b.h/2;
  const dx = bx - ax, dy = by - ay;
  if(Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? ["r","l"] : ["l","r"];
  return dy >= 0 ? ["b","t"] : ["t","b"];
}

function ctrlPoint(p, side, d){
  switch(side){
    case "l": return {x:p.x - d, y:p.y};
    case "r": return {x:p.x + d, y:p.y};
    case "t": return {x:p.x,     y:p.y - d};
    default:  return {x:p.x,     y:p.y + d};
  }
}

function bezierPoint(p0,p1,p2,p3,t){
  const mt = 1-t, a = mt*mt*mt, b = 3*mt*mt*t, c = 3*mt*t*t, d = t*t*t;
  return {
    x: a*p0.x + b*p1.x + c*p2.x + d*p3.x,
    y: a*p0.y + b*p1.y + c*p2.y + d*p3.y
  };
}

// 中文字符按 1em 估宽，ASCII 约 0.56em
function charWidth(ch, fs){
  if(/[\u1100-\u11FF\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6]/.test(ch)) return fs;
  if(ch === " ") return fs * 0.30;
  return fs * 0.56;
}

function wrapText(text, maxW, fs){
  const out = [];
  String(text == null ? "" : text).split("\n").forEach(para => {
    if(para === ""){ out.push(""); return; }
    let line = "", w = 0;
    for(const ch of para){
      const cw = charWidth(ch, fs);
      if(w + cw > maxW && line !== ""){ out.push(line); line = ch; w = cw; }
      else { line += ch; w += cw; }
    }
    out.push(line);
  });
  return out.length ? out : [""];
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2100);
}

/* ============================================================
   4. 视图变换
   ============================================================ */
function toWorld(clientX, clientY){
  const r = svg.getBoundingClientRect();
  return {
    x: (clientX - r.left - state.view.tx) / state.view.k,
    y: (clientY - r.top  - state.view.ty) / state.view.k
  };
}

function applyView(){
  const {tx,ty,k} = state.view;
  vp.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
  gridPat.setAttribute("patternTransform", `translate(${tx},${ty}) scale(${k})`);
  $("#stZoom").textContent = Math.round(k * 100) + "%";
}

function zoomAt(factor, cx, cy){
  const v = state.view;
  const r = svg.getBoundingClientRect();
  if(cx == null){ cx = r.width/2; cy = r.height/2; }
  const k0 = v.k;
  const k1 = Math.min(4, Math.max(0.15, k0 * factor));
  if(k1 === k0) return;
  // 保持鼠标下的世界坐标不动
  v.tx = cx - (cx - v.tx) * (k1/k0);
  v.ty = cy - (cy - v.ty) * (k1/k0);
  v.k = k1;
  applyView();
}

function contentBounds(){
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const add = (x,y,w,h) => {
    x1 = Math.min(x1,x); y1 = Math.min(y1,y);
    x2 = Math.max(x2,x+w); y2 = Math.max(y2,y+h);
  };
  state.nodes.forEach(n => add(n.x, n.y, n.w, n.h));
  state.notes.forEach(n => add(n.x, n.y, n.w, n.h));
  if(!isFinite(x1)) return {x:0,y:0,w:800,h:500,empty:true};
  return {x:x1, y:y1, w:x2-x1, h:y2-y1, empty:false};
}

function fitView(animate){
  const b = contentBounds();
  const r = svg.getBoundingClientRect();
  if(b.empty){
    state.view = {tx:r.width/2, ty:r.height/2, k:1};
    applyView(); return;
  }
  const pad = 70;
  const k = Math.min(2, Math.max(0.15, Math.min((r.width-pad*2)/b.w, (r.height-pad*2)/b.h)));
  state.view = {
    tx: (r.width  - b.w*k)/2 - b.x*k,
    ty: (r.height - b.h*k)/2 - b.y*k,
    k
  };
  applyView();
}

function resetView(){
  const r = svg.getBoundingClientRect();
  state.view = {tx:r.width/2 - 220, ty:r.height/2 - 140, k:1};
  applyView();
}

/* ============================================================
   5. 渲染
   ============================================================ */
function renderDefs(t){
  const colors = new Set([t.edge]);
  state.edges.forEach(e => {
    if(e.color) colors.add(e.color);
    if(sel.has("edge:"+e.id)) colors.add(t.sel);
  });
  let s = "";
  colors.forEach(c => {
    s += `<marker id="${markerId(c)}" viewBox="0 0 10 10" refX="10" refY="5"
      markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  });
  defs.innerHTML = s;
}

function nodeShapePath(n, fill, stroke){
  const {x,y,w,h} = n;
  const sw = 1.6;
  switch(n.shape){
    case "round":
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h/2, 14)}"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    case "diamond": {
      const pts = `${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`;
      return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}"
        stroke-width="${sw}" stroke-linejoin="round"/>`;
    }
    case "ellipse":
      return `<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    case "cylinder": {
      const ry = Math.min(13, h*0.16);
      return `<path d="M${x},${y+ry}
        a${w/2},${ry} 0 0 1 ${w},0
        v${h-ry*2}
        a${w/2},${ry} 0 0 1 ${-w},0 z"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
        <path d="M${x},${y+ry} a${w/2},${ry} 0 0 0 ${w},0"
        fill="none" stroke="${stroke}" stroke-width="${sw}"/>`;
    }
    default:
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  }
}

function renderNode(n, t){
  const fill   = n.fill   || t.nodeFill;
  const stroke = n.stroke || t.nodeStroke;
  const txtCol = n.textColor || t.nodeText;
  const isSel  = sel.has("node:"+n.id);
  const fs = n.fontSize || 14;

  let innerW = n.w - 26;
  if(n.shape === "diamond") innerW = n.w * 0.62;
  if(n.shape === "ellipse") innerW = n.w * 0.78;

  const lines = wrapText(n.text, innerW, fs);
  const lh = fs * 1.42;
  const totalH = lines.length * lh;
  const cx = n.x + n.w/2;
  const startY = n.y + n.h/2 - totalH/2 + lh/2;

  const textSvg = lines.map((ln, i) =>
    `<text x="${cx}" y="${startY + i*lh}" text-anchor="middle"
      dominant-baseline="central" font-family='${FONT}' font-size="${fs}"
      fill="${txtCol}">${esc(ln)}</text>`
  ).join("");

  const anchors = ["l","r","t","b"].map(side => {
    const p = anchorPoint(n, side);
    return `<circle class="anchor ui-only" data-kind="anchor" data-id="${n.id}"
      data-side="${side}" cx="${p.x}" cy="${p.y}" r="5"
      fill="${t.canvas}" stroke="${t.sel}" stroke-width="1.6"/>`;
  }).join("");

  const selRing = isSel ? `<rect class="ui-only" x="${n.x-6}" y="${n.y-6}"
    width="${n.w+12}" height="${n.h+12}" rx="9" fill="none"
    stroke="${t.sel}" stroke-width="1.6" stroke-dasharray="5 3" opacity=".85"/>` : "";

  return `<g class="node${isSel ? " sel" : ""}" data-kind="node" data-id="${n.id}">
    ${selRing}
    ${nodeShapePath(n, fill, stroke)}
    ${textSvg}
    ${anchors}
  </g>`;
}

function renderEdge(e, t){
  const a = byId(e.from), b = byId(e.to);
  if(!a || !b) return "";
  const auto = autoSides(a, b);
  const s1 = (e.fromSide && e.fromSide !== "auto") ? e.fromSide : auto[0];
  const s2 = (e.toSide   && e.toSide   !== "auto") ? e.toSide   : auto[1];

  const p1 = anchorPoint(a, s1);
  const p2 = anchorPoint(b, s2);
  const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  const d = Math.max(46, dist * 0.42);

  const c1 = ctrlPoint(p1, s1, d);
  const c2 = ctrlPoint(p2, s2, d);

  const isSel = sel.has("edge:"+e.id);
  const color = isSel ? t.sel : (e.color || t.edge);
  const dash  = e.dashed ? 'stroke-dasharray="7 5"' : "";
  const sw    = isSel ? 2.6 : 1.9;

  const path = `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;

  // 标签放在曲线中点
  let labelSvg = "";
  if(e.label){
    const m = bezierPoint(p1, c1, c2, p2, 0.5);
    const fs = 11.5;
    const lw = Array.from(e.label).reduce((s,ch) => s + charWidth(ch, fs), 0) + 14;
    labelSvg = `
      <rect x="${m.x - lw/2}" y="${m.y - 10}" width="${lw}" height="20" rx="5"
        fill="${t.edgeBg}" stroke="${isSel ? t.sel : "none"}" stroke-width="1" opacity=".96"/>
      <text x="${m.x}" y="${m.y}" text-anchor="middle" dominant-baseline="central"
        font-family='${FONT}' font-size="${fs}" fill="${isSel ? t.sel : t.edgeText}">${esc(e.label)}</text>`;
  }

  // 透明加粗命中层，方便点选细线
  return `<g class="edge" data-kind="edge" data-id="${e.id}">
    <path d="${path}" fill="none" stroke="transparent" stroke-width="16" style="cursor:pointer"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="${sw}"
      ${dash} marker-end="url(#${markerId(color)})"/>
    ${labelSvg}
  </g>`;
}

function renderNote(n, t){
  const isSel = sel.has("note:"+n.id);
  const fill = n.color || t.noteFill;
  const fs = 12.5;
  const lines = wrapText(n.text, n.w - 22, fs);
  const lh = fs * 1.5;
  const body = lines.slice(0, Math.floor((n.h - 26)/lh)).map((ln,i) =>
    `<text x="${n.x+11}" y="${n.y+30+i*lh}" font-family='${FONT}' font-size="${fs}"
      fill="${t.noteText}">${esc(ln)}</text>`).join("");

  const ring = isSel ? `<rect x="${n.x-5}" y="${n.y-5}" width="${n.w+10}" height="${n.h+10}"
    rx="8" fill="none" stroke="${t.sel}" stroke-width="1.6" stroke-dasharray="5 3"/>` : "";

  return `<g class="note" data-kind="note" data-id="${n.id}">
    ${ring}
    <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5"
      fill="${fill}" stroke="${t.noteStroke}" stroke-width="1.4"/>
    <path d="M${n.x},${n.y+6} a6,6 0 0 1 6,-6 h${n.w-12} a6,6 0 0 1 6,6 v3 h-${n.w} z"
      fill="${t.noteBar}"/>
    ${body}
  </g>`;
}

function render(){
  const t = THEMES[state.theme];
  renderDefs(t);

  gridRect.setAttribute("fill", t.canvas);
  gridDot.setAttribute("fill", t.grid);

  let html = "";
  state.edges.forEach(e => { html += renderEdge(e, t); });
  state.nodes.forEach(n => { html += renderNode(n, t); });
  state.notes.forEach(n => { html += renderNote(n, t); });
  vp.innerHTML = html;

  applyView();
  updateStatus();
}

function updateStatus(){
  $("#stCount").innerHTML = `节点 <b>${state.nodes.length}</b> · 连线 <b>${state.edges.length}</b>`
    + (state.notes.length ? ` · 批注 <b>${state.notes.length}</b>` : "");
  const nSel = selCount("node"), eSel = selCount("edge"), tSel = selCount("note");
  const parts = [];
  if(nSel) parts.push(`节点 ${nSel}`);
  if(eSel) parts.push(`连线 ${eSel}`);
  if(tSel) parts.push(`批注 ${tSel}`);
  $("#stSel").textContent = parts.length ? "已选 " + parts.join(" / ") : "";
}

function selCount(type){
  let c = 0;
  sel.forEach(k => { if(k.startsWith(type + ":")) c++; });
  return c;
}
function selList(type){
  return Array.from(sel).filter(k => k.startsWith(type+":")).map(k => k.slice(type.length+1));
}

/* ============================================================
   6. 历史记录
   ============================================================ */
const history = { stack:[], idx:-1 };

function snapshot(){
  return JSON.stringify({nodes:state.nodes, edges:state.edges, notes:state.notes});
}

function pushHistory(){
  const s = snapshot();
  if(history.idx >= 0 && history.stack[history.idx] === s) return;
  history.stack = history.stack.slice(0, history.idx + 1);
  history.stack.push(s);
  if(history.stack.length > 150) history.stack.shift();
  history.idx = history.stack.length - 1;
  updateHistoryButtons();
  saveLocal();
}

function applySnapshot(s){
  const o = JSON.parse(s);
  state.nodes = o.nodes || [];
  state.edges = o.edges || [];
  state.notes = o.notes || [];
  sel.clear();
  connectFrom = null;
  render();
  renderInspector();
  saveLocal();
}

function undo(){
  if(history.idx <= 0) return;
  history.idx--;
  applySnapshot(history.stack[history.idx]);
  updateHistoryButtons();
}
function redo(){
  if(history.idx >= history.stack.length - 1) return;
  history.idx++;
  applySnapshot(history.stack[history.idx]);
  updateHistoryButtons();
}
function updateHistoryButtons(){
  $("#btnUndo").disabled = history.idx <= 0;
  $("#btnRedo").disabled = history.idx >= history.stack.length - 1;
}

function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      nodes:state.nodes, edges:state.edges, notes:state.notes,
      theme:state.theme, view:state.view
    }));
  }catch(err){ /* 隐私模式或超配额时静默 */ }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    state.nodes = o.nodes || [];
    state.edges = o.edges || [];
    state.notes = o.notes || [];
    state.theme = o.theme === "dark" ? "dark" : "light";
    if(o.view && typeof o.view.k === "number") state.view = o.view;
    return true;
  }catch(err){ return false; }
}

/* ============================================================
   9. 自动布局（分层 + 重心排序）
   ============================================================ */
function autoLayout(dir){
  if(state.nodes.length === 0){ toast("画布是空的，先加点东西"); return; }

  const ids = state.nodes.map(n => n.id);
  const ind = new Map(ids.map(i => [i, 0]));
  const out = new Map(ids.map(i => [i, []]));
  const preds = new Map(ids.map(i => [i, []]));

  state.edges.forEach(e => {
    if(!ind.has(e.from) || !ind.has(e.to) || e.from === e.to) return;
    out.get(e.from).push(e.to);
    preds.get(e.to).push(e.from);
    ind.set(e.to, ind.get(e.to) + 1);
  });

  // 分层
  const placed = new Set();
  const layers = [];
  let cur = ids.filter(i => ind.get(i) === 0);
  if(cur.length === 0) cur = [ids[0]];

  let guard = 0;
  while(cur.length && guard++ < ids.length + 5){
    const layer = cur.filter(i => !placed.has(i));
    if(layer.length === 0) break;
    layers.push(layer);
    layer.forEach(i => placed.add(i));

    const next = [];
    layer.forEach(i => {
      out.get(i).forEach(t => {
        if(placed.has(t) || next.indexOf(t) >= 0) return;
        if(preds.get(t).every(p => placed.has(p))) next.push(t);
      });
    });

    if(next.length === 0){
      const rest = ids.filter(i => !placed.has(i));
      if(rest.length === 0) break;
      next.push(rest[0]);   // 断开环：强行推进一个
    }
    cur = next;
  }

  // 重心排序：降低交叉
  const nodeMap = new Map(state.nodes.map(n => [n.id, n]));
  for(let li = 1; li < layers.length; li++){
    const prevPos = new Map();
    layers[li-1].forEach((id, idx) => {
      prevPos.set(id, nodeMap.get(id).y != null ? idx : idx);
    });
    layers[li].sort((a, b) => {
      const pa = preds.get(a).filter(p => prevPos.has(p));
      const pb = preds.get(b).filter(p => prevPos.has(p));
      const va = pa.length ? pa.reduce((s,p) => s + prevPos.get(p), 0)/pa.length : 999;
      const vb = pb.length ? pb.reduce((s,p) => s + prevPos.get(p), 0)/pb.length : 999;
      return va - vb;
    });
  }

  // 定位
  const GAP_X = 96, GAP_Y = 34;
  const LR = dir !== "TB";
  let cursor = 0;

  layers.forEach(layer => {
    const items = layer.map(i => nodeMap.get(i)).filter(Boolean);
    if(!items.length) return;
    const thick = Math.max(...items.map(n => LR ? n.w : n.h));      // 层厚
    const totalLen = items.reduce((s,n) => s + (LR ? n.h : n.w), 0)
                   + GAP_Y * (items.length - 1);
    let run = -totalLen/2;
    items.forEach(n => {
      const size = LR ? n.h : n.w;
      if(LR){ n.x = cursor; n.y = run; }
      else  { n.y = cursor; n.x = run; }
      run += size + GAP_Y;
    });
    // 层内居中到该层厚度
    items.forEach(n => {
      if(LR) n.x += (thick - n.w)/2;
      else   n.y += (thick - n.h)/2;
    });
    cursor += thick + GAP_X;
  });

  render();
  renderInspector();
  fitView();
  pushHistory();
  toast("布局完成：" + (LR ? "从左到右" : "从上到下"));
}

function selectOnly(kind, id){
  sel.clear();

  renderInspector();

function toggleSelect(kind, id){
  const k = kind + ":" + id;
  if(sel.has(k)) sel.delete(k); else sel.add(k);

function clearSelect(){
  if(sel.size === 0) return;

  renderInspector();
}

function deleteSelection(){
  if(sel.size === 0) return;
  const delNodes = new Set(selList("node"));
  const delEdges = new Set(selList("edge"));
  const delNotes = new Set(selList("note"));

  state.nodes = state.nodes.filter(n => !delNodes.has(n.id));
  state.edges = state.edges.filter(e =>
    !delEdges.has(e.id) && !delNodes.has(e.from) && !delNodes.has(e.to));
  state.notes = state.notes.filter(n => !delNotes.has(n.id));

  sel.clear();
  render();
  renderInspector();
  pushHistory();
  saveLocal();
}

function duplicateSelection(){
  const nIds = selList("node");
  if(nIds.length === 0){ toast("没有选中节点"); return; }
  const map = new Map();
  const newIds = [];
  nIds.forEach(id => {
    const src = byId(id);
    if(!src) return;
    const copy = Object.assign({}, src, {id: uid("n"), x: src.x + 34, y: src.y + 34});
    state.nodes.push(copy);
    map.set(id, copy.id);
    newIds.push(copy.id);
  });
  state.edges.forEach(e => {
    if(map.has(e.from) && map.has(e.to)){
      state.edges.push(Object.assign({}, e, {
        id: uid("e"), from: map.get(e.from), to: map.get(e.to)
      }));
    }
  });
  sel.clear();
  newIds.forEach(id => sel.add("node:" + id));
  render();
  renderInspector();
  pushHistory();
}

/* ---------- 指针事件 ---------- */
svg.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove);
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);

function onPointerDown(ev){
  if(ev.button === 2) return;                  // 右键留给菜单/取消
  if(editorOverlay.classList.contains("on")) return;

  const target = ev.target.closest ? ev.target.closest("[data-kind]") : null;
  const kind = target ? target.dataset.kind : "empty";
  const world = toWorld(ev.clientX, ev.clientY);
  lastMouseWorld = world;

  // 中键 / 空格 / 右键 = 平移
  if(ev.button === 1 || spaceDown){
    ev.preventDefault();
    drag = { type:"pan", sx:ev.clientX, sy:ev.clientY,
             ox:state.view.tx, oy:state.view.ty };
    svg.classList.add("panning");
    return;
  }

  /* --- 工具：加节点 --- */
  if(tool === "node" && kind !== "anchor"){
    const n = mkNode(Object.assign(BASE_NODE(), {
      x: world.x - 85, y: world.y - 32, text:"新节点"
    }));
    state.nodes.push(n);
    setTool("select");
    sel.clear(); sel.add("node:" + n.id);
    render(); renderInspector();
    pushHistory();
    startEdit(n);
    return;
  }

  /* --- 工具：加便签 --- */
  if(tool === "note" && kind !== "anchor"){
    const nt = {id:uid("t"), x: world.x - 90, y: world.y - 50,
                w:180, h:110, text:"写点什么…", color:""};
    state.notes.push(nt);
    setTool("select");
    sel.clear(); sel.add("note:" + nt.id);
    render(); renderInspector();
    pushHistory();
    startEdit(nt, "note");
    return;
  }

  /* --- 锚点：拉线 --- */
  if(kind === "anchor"){
    ev.preventDefault();
    const src = byId(target.dataset.id);
    if(!src) return;
    drag = { type:"wire", from:src.id, side:target.dataset.side,
             p1: anchorPoint(src, target.dataset.side),
             cur: world };
    return;
  }

  /* --- 连线工具：点两次 --- */
  if(tool === "connect" && kind === "node"){
    const id = target.dataset.id;
    if(!connectFrom){ connectFrom = id; toast("已选起点，再点目标节点"); render(); return; }
    if(connectFrom !== id){
      state.edges.push(mkEdge(connectFrom, id));
      pushHistory();
    }
    connectFrom = null;
    render();
    return;
  }

  /* --- 节点 --- */
  if(kind === "node"){
    const id = target.dataset.id;
    const wasMulti = sel.size > 1;
    if(ev.shiftKey || ev.metaKey || ev.ctrlKey){
      toggleSelect("node", id);
    } else if(!sel.has("node:" + id)){
      selectOnly("node", id);
    } else {
      renderInspector();
    }
    // 开始拖拽（多选一起动）
    const ids = selList("node");
    const starts = {};
    ids.forEach(i => { const n = byId(i); if(n) starts[i] = {x:n.x, y:n.y}; });
    drag = { type:"move", sx:world.x, sy:world.y, starts, moved:false,
             hitId:id, wasMulti };
    return;
  }

  /* --- 连线 --- */
  if(kind === "edge"){
    const id = target.dataset.id;
    if(ev.shiftKey || ev.metaKey || ev.ctrlKey) toggleSelect("edge", id);
    else selectOnly("edge", id);
    return;
  }

  /* --- 便签 --- */
  if(kind === "note"){
    const id = target.dataset.id;
    if(ev.shiftKey || ev.metaKey || ev.ctrlKey) toggleSelect("note", id);
    else if(!sel.has("note:" + id)) selectOnly("note", id);
    const ids = selList("note");
    const starts = {};
    ids.forEach(i => {
      const n = state.notes.find(x => x.id === i);
      if(n) starts[i] = {x:n.x, y:n.y};
    });
    drag = { type:"moveNote", sx:world.x, sy:world.y, starts, moved:false };
    return;
  }

  /* --- 空白：框选 / 取消 --- */
  if(kind === "empty"){
    if(!(ev.shiftKey || ev.metaKey || ev.ctrlKey)) clearSelect();
    drag = { type:"rubber", sx:world.x, sy:world.y, x:world.x, y:world.y, add:ev.shiftKey };
    render();
  }
}

function onPointerMove(ev){
  const world = toWorld(ev.clientX, ev.clientY);
  lastMouseWorld = world;
  $("#stPos").textContent = `x ${Math.round(world.x)}, y ${Math.round(world.y)}`;

  if(!drag) return;

  if(drag.type === "pan"){
    state.view.tx = drag.ox + (ev.clientX - drag.sx);
    state.view.ty = drag.oy + (ev.clientY - drag.sy);
    applyView();
    return;
  }

  if(drag.type === "move"){
    const dx = world.x - drag.sx, dy = world.y - drag.sy;
    if(!drag.moved && Math.hypot(dx, dy) * state.view.k < 2) return;
    drag.moved = true;
    Object.keys(drag.starts).forEach(id => {
      const n = byId(id);
      if(!n) return;
      n.x = Math.round(drag.starts[id].x + dx);
      n.y = Math.round(drag.starts[id].y + dy);
    });
    render();
    return;
  }

  if(drag.type === "moveNote"){
    const dx = world.x - drag.sx, dy = world.y - drag.sy;
    if(!drag.moved && Math.hypot(dx, dy) * state.view.k < 2) return;
    drag.moved = true;
    Object.keys(drag.starts).forEach(id => {
      const n = state.notes.find(x => x.id === id);
      if(!n) return;
      n.x = Math.round(drag.starts[id].x + dx);
      n.y = Math.round(drag.starts[id].y + dy);
    });
    render();
    return;
  }

  if(drag.type === "wire"){
    drag.cur = world;
    renderWirePreview(world);
    return;
  }

  if(drag.type === "rubber"){
    drag.x = world.x; drag.y = world.y;
    renderRubber();
    return;
  }
}

function onPointerUp(ev){
  if(!drag) return;
  svg.classList.remove("panning");

  if(drag.type === "wire"){
    // 找鼠标下的节点
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const nodeEl = el && el.closest ? el.closest('[data-kind="node"]') : null;
    if(nodeEl){
      const toId = nodeEl.dataset.id;
      if(toId !== drag.from){
        state.edges.push(mkEdge(drag.from, toId));
        pushHistory();
      }
    }
    drag = null;
    render();
    return;
  }

  if(drag.type === "rubber"){
    const x1 = Math.min(drag.sx, drag.x), x2 = Math.max(drag.sx, drag.x);
    const y1 = Math.min(drag.sy, drag.y), y2 = Math.max(drag.sy, drag.y);
    const moved = (x2 - x1) * state.view.k > 4 || (y2 - y1) * state.view.k > 4;
    if(moved){
      if(!drag.add) sel.clear();
      state.nodes.forEach(n => {
        if(n.x < x2 && n.x + n.w > x1 && n.y < y2 && n.y + n.h > y1){
          sel.add("node:" + n.id);
        }
      });
    }
    drag = null;
    render();
    renderInspector();
    return;
  }

  if(drag.type === "move" || drag.type === "moveNote"){
    const wasMoved = drag.moved;
    const hitId = drag.hitId, wasMulti = drag.wasMulti;
    drag = null;
    if(wasMoved){ pushHistory(); saveLocal(); }
    // 多选状态下单击（未拖动）某个节点 → 收窄为单选
    if(!wasMoved && wasMulti && hitId){ selectOnly("node", hitId); return; }
    renderInspector();
    return;
  }

  drag = null;
}

function renderWirePreview(world){
  // 直接在当前 DOM 上挂一条临时线，避免整帧重绘打断拖拽手感
  let tmp = document.getElementById("wirePreview");
  const t = THEMES[state.theme];
  if(!tmp){
    tmp = document.createElementNS(NS, "path");
    tmp.setAttribute("id","wirePreview");
    tmp.setAttribute("fill","none");
    tmp.setAttribute("stroke", t.sel);
    tmp.setAttribute("stroke-width","2");
    tmp.setAttribute("stroke-dasharray","6 4");
    tmp.setAttribute("pointer-events","none");   // 关键：别挡住落点命中检测
    vp.appendChild(tmp);
  }
  tmp.setAttribute("stroke", t.sel);
  const p1 = drag.p1;
  const d = Math.max(46, Math.hypot(world.x-p1.x, world.y-p1.y) * 0.42);
  const c1 = ctrlPoint(p1, drag.side, d);
  tmp.setAttribute("d",
    `M${p1.x},${p1.y} C${c1.x},${c1.y} ${world.x},${world.y} ${world.x},${world.y}`);
}

function renderRubber(){
  let r = document.getElementById("rubber");
  const t = THEMES[state.theme];
  if(!r){
    r = document.createElementNS(NS, "rect");
    r.setAttribute("id","rubber");
    r.setAttribute("fill", t.sel);
    r.setAttribute("pointer-events","none");
    vp.appendChild(r);
  }
  const x = Math.min(drag.sx, drag.x), y = Math.min(drag.sy, drag.y);
  r.setAttribute("x", x); r.setAttribute("y", y);
  r.setAttribute("width", Math.abs(drag.x - drag.sx));
  r.setAttribute("height", Math.abs(drag.y - drag.sy));
  r.setAttribute("opacity","0.08");
  r.setAttribute("rx","3");
}

/* ---------- 滚轮缩放 ---------- */
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const cx = ev.clientX - r.left;
  const cy = ev.clientY - r.top;
  if(ev.ctrlKey || ev.metaKey || !ev.shiftKey){
    zoomAt(ev.deltaY < 0 ? 1.12 : 1/1.12, cx, cy);
  } else {
    // Shift + 滚轮 = 横向平移
    state.view.tx -= ev.deltaY;
    applyView();
  }
}, {passive:false});

/* ---------- 双击 ---------- */
svg.addEventListener("dblclick", ev => {
  const target = ev.target.closest ? ev.target.closest("[data-kind]") : null;
  if(target && target.dataset.kind === "node"){
    const n = byId(target.dataset.id);
    if(n) startEdit(n);
    return;
  }
  if(target && target.dataset.kind === "note"){
    const nt = state.notes.find(x => x.id === target.dataset.id);
    if(nt) startEdit(nt, "note");
    return;
  }
  if(!target || target.dataset.kind === "empty"){
    // 双击空白新建节点
    const w = toWorld(ev.clientX, ev.clientY);
    const n = mkNode(Object.assign(BASE_NODE(), {
      x: w.x - 85, y: w.y - 32, text:"新节点"
    }));
    state.nodes.push(n);
    sel.clear(); sel.add("node:" + n.id);
    render(); renderInspector();
    pushHistory();
    startEdit(n);
  }
});

/* ---------- 右键取消 ---------- */
svg.addEventListener("contextmenu", ev => {
  ev.preventDefault();
  if(sel.size > 0) clearSelect();
  else if(tool !== "select") setTool("select");
});

/* ============================================================
   11. 文字就地编辑
   ============================================================ */
let editing = null;   // {obj, kind}

function startEdit(obj, kind){
  if(!obj) return;
  const k = state.view.k;
  const r = svg.getBoundingClientRect();

  editing = {obj, kind: kind || "node"};
  const pad = 6;

  let left, top, width, height;
  if(kind === "note"){
    left = r.left + state.view.tx + obj.x * k + pad;
    top  = r.top  + state.view.ty + (obj.y + 20) * k + pad;
    width  = obj.w * k - pad*2;
    height = (obj.h - 24) * k - pad*2;
    editorArea.style.textAlign = "left";
    editorArea.style.fontSize = Math.max(10, 12.5 * k) + "px";
    editorArea.style.lineHeight = "1.45";
  } else {
    left = r.left + state.view.tx + obj.x * k + pad;
    top  = r.top  + state.view.ty + obj.y * k + pad;
    width  = obj.w * k - pad*2;
    height = obj.h * k - pad*2;
    editorArea.style.textAlign = "center";
    editorArea.style.fontSize = Math.max(10, (obj.fontSize || 14) * k) + "px";
    editorArea.style.lineHeight = "1.4";
  }

  editorOverlay.style.left = Math.max(0, left) + "px";
  editorOverlay.style.top  = Math.max(0, top) + "px";
  editorOverlay.style.width = Math.max(80, width) + "px";
  editorOverlay.style.height = Math.max(36, height) + "px";
  editorOverlay.classList.add("on");

  editorArea.value = obj.text || "";
  editorArea.focus();
  editorArea.select();
}

function commitEdit(){
  if(!editing) return;
  const {obj, kind} = editing;
  obj.text = editorArea.value;
  editing = null;
  editorOverlay.classList.remove("on");
  render();
  renderInspector();
  pushHistory();
  saveLocal();
}

function cancelEdit(){
  editing = null;
  editorOverlay.classList.remove("on");
}

editorArea.addEventListener("blur", () => { if(editing) commitEdit(); });
editorArea.addEventListener("keydown", ev => {
  ev.stopPropagation();
  if(ev.key === "Escape"){ ev.preventDefault(); cancelEdit(); }
  if(ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); commitEdit(); }
  if(ev.key === "Enter" && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey && editing && editing.kind === "node"){
    // 单行节点：回车直接提交
    ev.preventDefault(); commitEdit();
  }
});

  const nSel = selList("node");

  if(sel.size === 0){
    inspector.innerHTML = `
      <div class="insp-title">画布</div>
      <div class="insp-empty">
        <b>双击空白</b> 快速加节点<br>
        <b>拖节点四边圆点</b> 拉出连线<br>
        <b>Shift + 拖动</b> 框选多个<br>

      <div class="insp-sec">
        <div class="insp-title">统计</div>

        <div class="field"><label>连线</label><span class="grow">${state.edges.length}</span></div>
        <div class="field"><label>批注</label><span class="grow">${state.notes.length}</span></div>
      </div>`;
    return;
  }

  if(nSel.length === 1 && eSel.length === 0 && tSel.length === 0){
    renderNodePanel(byId(nSel[0]));
    return;
  }
  if(eSel.length === 1 && nSel.length === 0 && tSel.length === 0){
    renderEdgePanel(state.edges.find(e => e.id === eSel[0]));
    return;
  }
  if(tSel.length === 1 && nSel.length === 0 && eSel.length === 0){
    renderNotePanel(state.notes.find(n => n.id === tSel[0]));
    return;
  }
  renderMultiPanel(nSel.length, eSel.length, tSel.length);
}

inspector.addEventListener("input", ev => {
  const el = ev.target;
  const prop = el.dataset.prop;
  if(!prop){ return; }
  const nIds = selList("node"), eIds = selList("edge"), tIds = selList("note");

  if(nIds.length === 1){
    const n = byId(nIds[0]); if(!n) return;
    if(prop === "text"){ n.text = el.value; }
    else if(prop === "w") n.w = Math.max(40, +el.value || 40);
    else if(prop === "h") n.h = Math.max(28, +el.value || 28);
    else if(prop === "x") n.x = +el.value || 0;
    else if(prop === "y") n.y = +el.value || 0;
    else if(prop === "fill") n.fill = el.value;
    else if(prop === "stroke") n.stroke = el.value;
    else if(prop === "textColor") n.textColor = el.value;
    render(); saveLocal();
  } else if(eIds.length === 1){
    const e = state.edges.find(x => x.id === eIds[0]); if(!e) return;
    if(prop === "label") e.label = el.value;
    else if(prop === "color") e.color = el.value;
    else if(prop === "fromSide") e.fromSide = el.value;
    else if(prop === "toSide") e.toSide = el.value;
    render(); saveLocal();
  } else if(tIds.length === 1){
    const nt = state.notes.find(x => x.id === tIds[0]); if(!nt) return;
    if(prop === "text") nt.text = el.value;
    else if(prop === "w") nt.w = Math.max(90, +el.value || 90);
    else if(prop === "h") nt.h = Math.max(60, +el.value || 60);
    else if(prop === "color") nt.color = el.value;
    render(); saveLocal();
  }
  scheduleHistory();
});

function doAlign(mode){
  const ids = selList("node");
  if(ids.length < 2){ toast("至少选中两个节点"); return; }
  const nodes = ids.map(byId).filter(Boolean);
  if(nodes.length < 2) return;

  if(mode === "left"){
    const v = Math.min(...nodes.map(n => n.x));
    nodes.forEach(n => n.x = v);
  } else if(mode === "right"){
    const v = Math.max(...nodes.map(n => n.x + n.w));
    nodes.forEach(n => n.x = v - n.w);
  } else if(mode === "hcenter"){
    const v = nodes.reduce((s,n) => s + n.x + n.w/2, 0) / nodes.length;
    nodes.forEach(n => n.x = Math.round(v - n.w/2));
  } else if(mode === "top"){
    const v = Math.min(...nodes.map(n => n.y));
    nodes.forEach(n => n.y = v);
  } else if(mode === "bottom"){
    const v = Math.max(...nodes.map(n => n.y + n.h));
    nodes.forEach(n => n.y = v - n.h);
  } else if(mode === "vcenter"){
    const v = nodes.reduce((s,n) => s + n.y + n.h/2, 0) / nodes.length;
    nodes.forEach(n => n.y = Math.round(v - n.h/2));
  } else if(mode === "distH"){
    const sorted = nodes.slice().sort((a,b) => a.x - b.x);
    const span = (sorted[sorted.length-1].x + sorted[sorted.length-1].w) - sorted[0].x;
    const sumW = sorted.reduce((s,n) => s + n.w, 0);
    const gap = (span - sumW) / (sorted.length - 1);
    let cur = sorted[0].x;
    sorted.forEach((n,i) => { n.x = Math.round(cur); cur += n.w + (i === sorted.length-1 ? 0 : gap); });
  } else if(mode === "distV"){
    const sorted = nodes.slice().sort((a,b) => a.y - b.y);
    const span = (sorted[sorted.length-1].y + sorted[sorted.length-1].h) - sorted[0].y;
    const sumH = sorted.reduce((s,n) => s + n.h, 0);
    const gap = (span - sumH) / (sorted.length - 1);
    let cur = sorted[0].y;
    sorted.forEach((n,i) => { n.y = Math.round(cur); cur += n.h + (i === sorted.length-1 ? 0 : gap); });
  }
  render(); saveLocal(); pushHistory();
}

function openMenu(anchor, items){
  menuEl.innerHTML = "";
  items.forEach(it => {
    if(it.sep){ const d = document.createElement("div"); d.className = "menu-sep"; menuEl.appendChild(d); return; }
    if(it.head){ const d = document.createElement("div"); d.className = "menu-head"; d.textContent = it.head; menuEl.appendChild(d); return; }
    const b = document.createElement("button");
    b.className = "menu-item";
    b.innerHTML = `<span>${it.label}</span>${it.k ? `<span class="k">${it.k}</span>` : ""}`;
    b.addEventListener("click", () => { closeMenu(); it.fn(); });
    menuEl.appendChild(b);
  });
  menuLayer.classList.add("on");

  const r = anchor.getBoundingClientRect();
  const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let left = r.left, top = r.bottom + 6;
  if(left + mw > window.innerWidth - 10) left = window.innerWidth - mw - 10;
  if(top + mh > window.innerHeight - 10) top = Math.max(10, r.top - mh - 6);
  menuEl.style.left = left + "px";
  menuEl.style.top = top + "px";
}

function closeMenu(){ menuLayer.classList.remove("on"); }

function importJSONText(text){
  let o;
  try{ o = JSON.parse(text); }catch(err){ toast("JSON 解析失败，检查文件格式"); return; }
  if(!o || !Array.isArray(o.nodes)){ toast("不是有效的 FlowForge 文件"); return; }

function toCSV(headers, rows){
  const escv = v => {
    const s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "\uFEFF" + [headers.join(",")].concat(rows.map(r => r.map(escv).join(","))).join("\r\n");
}

function exportCSV(){
  if(state.nodes.length === 0){ toast("没有内容可导出"); return; }
  const nCsv = toCSV(
    ["id","text","shape","x","y","w","h","fill","stroke"],
    state.nodes.map(n => [n.id, n.text, n.shape, Math.round(n.x), Math.round(n.y),
      Math.round(n.w), Math.round(n.h), n.fill || "", n.stroke || ""])
  );
  const eCsv = toCSV(
    ["from","to","label","dashed","fromSide","toSide"],
    state.edges.map(e => [e.from, e.to, e.label || "", e.dashed ? 1 : 0,
      e.fromSide || "auto", e.toSide || "auto"])
  );
  const base = "flowforge-" + stamp();
  download(new Blob([nCsv], {type:"text/csv;charset=utf-8"}), base + "-nodes.csv");
  setTimeout(() => {
    download(new Blob([eCsv], {type:"text/csv;charset=utf-8"}), base + "-edges.csv");
  }, 220);
  toast("已导出两个 CSV（节点表 + 连线表）");
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], cur = "", inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if(c === "\r"){ /* skip */ }
      else cur += c;
    }
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}

function importCSVFiles(files){
  const readers = files.map(f => new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res({name:f.name.toLowerCase(), text:String(fr.result)});
    fr.onerror = () => res({name:f.name.toLowerCase(), text:""});
    fr.readAsText(f, "utf-8");
  }));

  Promise.all(readers).then(list => {
    let nodeRows = null, edgeRows = null;
    list.forEach(item => {
      const rows = parseCSV(item.text);
      if(rows.length < 2) return;
      const head = rows[0].map(h => h.trim().toLowerCase());
      if(head.includes("from") && head.includes("to")) edgeRows = rows;
      else if(head.includes("id")) nodeRows = rows;
    });

    if(!nodeRows){ toast("没找到节点表（需要 id 列）"); return; }

    const hidx = (head, name) => head.indexOf(name);
    const nHead = nodeRows[0].map(h => h.trim().toLowerCase());
    const nodes = [];
    const idMap = new Map();

    nodeRows.slice(1).forEach(r => {
      const get = k => { const i = hidx(nHead, k); return i >= 0 ? (r[i] || "").trim() : ""; };
      const rawId = get("id") || uid("n");
      const n = mkNode({
        x: +get("x") || 0, y: +get("y") || 0,
        w: +get("w") || 170, h: +get("h") || 64,
        text: get("text") || "节点",
        shape: SHAPES.some(s => s.id === get("shape")) ? get("shape") : "rect",
        fill: get("fill"), stroke: get("stroke")
      });
      idMap.set(rawId, n.id);
      nodes.push(n);
    });

    const edges = [];
    if(edgeRows){
      const eHead = edgeRows[0].map(h => h.trim().toLowerCase());
      const g = (r, k) => { const i = hidx(eHead, k); return i >= 0 ? (r[i] || "").trim() : ""; };
      edgeRows.slice(1).forEach(r => {
        const f = idMap.get(g(r,"from")), to = idMap.get(g(r,"to"));
        if(f && to) edges.push(mkEdge(f, to, g(r,"label"), {dashed: g(r,"dashed") === "1"}));
      });
    }

    state.nodes = nodes;
    state.edges = edges;
    state.notes = [];
    sel.clear();
    render(); renderInspector(); fitView(); pushHistory(); saveLocal();
    toast(`CSV 导入完成：${nodes.length} 节点 / ${edges.length} 连线`);
  });
}

function stamp(){
  const d = new Date();
  const p = v => String(v).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function toBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  const chunk = 0x8000;
  for(let i = 0; i < bytes.length; i += chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function exportPNG(){
  if(state.nodes.length === 0 && state.notes.length === 0){
    toast("画布是空的"); return;
  }
  const b = contentBounds();
  const pad = 56;
  const W = Math.ceil(b.w + pad*2);
  const H = Math.ceil(b.h + pad*2);
  const t = THEMES[state.theme];

  const clone = svg.cloneNode(true);
  clone.querySelectorAll(".ui-only").forEach(el => el.remove());
  // 去掉网格与 pattern 背景，改画纯色
  const gRect = clone.querySelector("#gridRect");
  if(gRect) gRect.remove();
  const gPat = clone.querySelector("#gridPat");
  if(gPat) gPat.remove();

  const vpC = clone.querySelector("#vp");
  vpC.setAttribute("transform", `translate(${pad - b.x}, ${pad - b.y}) scale(1)`);

  clone.setAttribute("width", W);
  clone.setAttribute("height", H);
  clone.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("x","0"); bg.setAttribute("y","0");
  bg.setAttribute("width", String(W)); bg.setAttribute("height", String(H));
  bg.setAttribute("fill", t.canvas);
  clone.insertBefore(bg, clone.firstChild);

  const svgStr = new XMLSerializer().serializeToString(clone);
  const url = "data:image/svg+xml;base64," + toBase64(svgStr);

  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const cv = document.createElement("canvas");
    cv.width = W * scale;
    cv.height = H * scale;
    const ctx = cv.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    cv.toBlob(blob => {
      if(!blob){ toast("PNG 生成失败"); return; }
      download(blob, "flowforge-" + stamp() + ".png");
      toast("PNG 已导出（2 倍分辨率）");
    }, "image/png");
  };
  img.onerror = () => toast("PNG 渲染失败，可试试导出 JSON");
  img.src = url;
}

/* ============================================================
   16. 快捷键
   ============================================================ */
window.addEventListener("keydown", ev => {
  if(editing) return;   // 编辑中不接管
  const mod = ev.ctrlKey || ev.metaKey;
  const key = ev.key;

  if(key === " " && !mod){
    if(document.activeElement && /input|textarea|select/i.test(document.activeElement.tagName)) return;
    spaceDown = true;
    ev.preventDefault();
    return;
  }

  // 撤销 / 重做
  if(mod && key.toLowerCase() === "z"){
    ev.preventDefault();
    ev.shiftKey ? redo() : undo();
    return;
  }
  if(mod && key.toLowerCase() === "y"){ ev.preventDefault(); redo(); return; }

  if(mod && key.toLowerCase() === "a"){
    ev.preventDefault();
    sel.clear();
    state.nodes.forEach(n => sel.add("node:" + n.id));
    render(); renderInspector();
    return;
  }
  if(mod && key.toLowerCase() === "s"){ ev.preventDefault(); exportJSON(); return; }
  if(mod && key.toLowerCase() === "e"){ ev.preventDefault(); exportPNG(); return; }
  if(mod && key.toLowerCase() === "d"){ ev.preventDefault(); duplicateSelection(); return; }
  if(mod && key === "0"){ ev.preventDefault(); $("#zReset").click(); return; }

  if(key === "Delete" || key === "Backspace"){
    if(sel.size > 0){ ev.preventDefault(); deleteSelection(); }
    return;
  }
  if(key === "Escape"){
    if(modalLayer.classList.contains("on")){ closeModal(); return; }
    if(menuLayer.classList.contains("on")){ closeMenu(); return; }
    if(connectFrom){ connectFrom = null; render(); return; }
    if(tool !== "select"){ setTool("select"); return; }
    clearSelect();
    return;
  }

  // 方向键微移
  if(key.startsWith("Arrow") && sel.size > 0){
    const step = ev.shiftKey ? 10 : 1;
    const dx = key === "ArrowLeft" ? -step : key === "ArrowRight" ? step : 0;
    const dy = key === "ArrowUp" ? -step : key === "ArrowDown" ? step : 0;
    if(dx || dy){
      ev.preventDefault();
      selList("node").forEach(id => {
        const n = byId(id);
        if(n){ n.x += dx; n.y += dy; }
      });
      selList("note").forEach(id => {
        const n = state.notes.find(x => x.id === id);
        if(n){ n.x += dx; n.y += dy; }
      });
      render(); saveLocal(); pushHistory();
    }
    return;
  }

  if(mod) return;
  if(document.activeElement && /input|textarea|select/i.test(document.activeElement.tagName)) return;

  const k = key.toLowerCase();
  if(k === "v"){ setTool("select"); }
  else if(k === "n"){ setTool("node"); }
  else if(k === "c"){ setTool("connect"); }
  else if(k === "m"){ setTool("note"); }
  else if(k === "f"){ fitView(); }
  else if(k === "?" || (ev.shiftKey && key === "/")){ showHelp(); }
});

});

    ["<kbd>Delete</kbd>", "删除选中内容"],
    ["<kbd>方向键</kbd> / <kbd>Shift</kbd>+方向键", "微移 1px / 10px"],
    ["<kbd>V</kbd> <kbd>N</kbd> <kbd>C</kbd> <kbd>M</kbd>", "选择 / 加节点 / 连线 / 批注"],
    ["<kbd>F</kbd>", "适配视图（全图居中）"],
    ["<kbd>Ctrl</kbd>+<kbd>S</kbd> / <kbd>Ctrl</kbd>+<kbd>E</kbd>", "导出 JSON / 导出 PNG"],
    ["<kbd>Esc</kbd>", "取消选择 / 退出当前工具"],
    ["<kbd>右键</kbd>", "取消选择"]
  ];
  modalEl.innerHTML = `
    <button class="btn icon modal-close" id="modalClose">✕</button>
    <h2>快捷键与操作</h2>
    <p class="sub">全部功能都在本地跑，不联网、不上传任何数据。</p>
    <table class="kbd-table">
      ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
    </table>
    <p class="sub" style="margin-top:16px">
      数据自动保存在浏览器本地（localStorage），关掉页面再打开还在。
      要跨设备、跨人分享，用「导出 → JSON」发文件。
    </p>`;
  modalLayer.classList.add("on");
  $("#modalClose").addEventListener("click", closeModal);
}
function closeModal(){ modalLayer.classList.remove("on"); }
modalLayer.addEventListener("click", ev => {
  if(ev.target === modalLayer || ev.target.id === "modalClose") closeModal();
});

/* ============================================================
   18. 初始化
   ============================================================ */
function boot(){
  const restored = loadLocal();
  applyTheme();

  if(!restored){
    // 首次打开给一份示例，避免面对空白发懵
    const data = TEMPLATES.approval.build();
    state.nodes = data.nodes;
    state.edges = data.edges;
    state.notes = [{
      id: uid("t"), x: 20, y: -170, w: 250, h: 106,
      text: "提示：双击任意节点改文字；拖节点四边的圆点可以拉线。",
      color: ""
    }];
    resetView();
  } else {
    // 有存档：内容居中显示，避免窗口尺寸变化后图跑到屏幕外
    if(state.nodes.length > 0 || state.notes.length > 0) fitView();
    else resetView();
  }

  render();
  renderInspector();
  pushHistory();

  // 首次进入给个轻提示
  if(!restored){
    setTimeout(() => toast("示例已载入 · 试试拖动节点四边的圆点拉线"), 700);
  }
}

window.addEventListener("resize", () => { applyView(); });
boot();

})();
</script>
